# Netlify-Konfiguration für das Leseprogramm
# Frontend: Vite-Build (dist). Speicher: Netlify Functions + Netlify Blobs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Saubere API-Pfade auf die Functions umschreiben (vor dem SPA-Fallback!)
[[redirects]]
  from = "/api/books"
  to = "/.netlify/functions/books"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

# SPA-Fallback: alle übrigen Routen auf index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sinnvolle Sicherheits- und Caching-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
